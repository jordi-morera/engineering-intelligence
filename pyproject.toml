[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineering-intelligence"
version = "0.1.0"
description = "AI-powered engineering intelligence system for transforming work items into validated specifications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
engineering-intelligence = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
